<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Step Tutoring</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --primary: #1d4ed8;
        --dark: #0f172a;
        --muted: #475569;
        --accent: #dbeafe;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg), #eef6ff);
        color: var(--dark);
      }

      .container {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        background: var(--card);
        border-radius: 20px;
        padding: 48px 32px;
        text-align: center;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
        max-width: 700px;
        width: 100%;
      }

      .badge {
        display: inline-block;
        background: var(--accent);
        color: var(--primary);
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(2.2rem, 5vw, 4rem);
        margin: 20px 0 16px;
      }

      p {
        font-size: 1.1rem;
        color: var(--muted);
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="badge">Hello World</div>
        <h1>Welcome to Star Step Tutoring</h1>
        <p>This is a sample GitHub Pages landing page for your tutoring company.</p>
      </div>
    </div>
  </body>
</html>
